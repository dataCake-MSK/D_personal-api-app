name: CI

on:
  pull_request:
  push:
    branches: [main]

# 워크플로가 침해돼도 피해를 줄이기 위해 기본 토큰은 읽기 전용으로 둔다.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci
